<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Basic Input Types</title>
</head>
<body>
    <form>
        <label>First Name</label>
        <input type="text" placeholder="Enter your First Name">
        <label>Last Name</label>
        <input type="text" placeholder="Enter your Last Name">
        <br>
        <br>
        <label>Phone Number</label>
        <input type="number" placeholder="Enter your Phone Number">
        <br>
        <br>
        <label>E-Mail Address</label>
        <input type="email" placeholder="Enter your E-Mail Address">
        <br>
        <br>
        <label>Password</label>
        <input type="password" placeholder="Enter a Strong Password">
        <br>
        <br>
        <label>Gender</label>
        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>
        <br>
        <br>
        <label>Date of Birth</label>
        <input type="date">
        <select>
            <option>Day</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            <option>20</option>
            <option>21</option>
            <option>22</option>
            <option>23</option>
            <option>24</option>
            <option>25</option>
            <option>26</option>
            <option>27</option>
            <option>28</option>
            <option>29</option>
            <option>30</option>
            <option>31</option>
        </select>
        <select>
            <option>Month</option>
            <option>January</option>
            <option>February</option>
            <option>March</option>
            <option>April</option>
            <option>May</option>
            <option>June</option>
            <option>July</option>
            <option>August</option>
            <option>September</option>
            <option>October</option>
            <option>November</option>
            <option>December</option>
        </select>
        <select>
            <option>Year</option>
            <option>1990</option>
            <option>1991</option>
            <option>1992</option>
            <option>1993</option>
            <option>1994</option>
            <option>1995</option>
            <option>1996</option>
            <option>1997</option>
            <option>1998</option>
        </select>
        <br>
        <br>
        <label>Color</label>
        <input type="color">
        <br>
        <br>
        <label>Range</label>
        <input type="range">
        <br>
        <br>
        <label>Checkbox</label>
        <input type="checkbox">
        <br>
        <br>
        <button type="submit">Submit</button>
        <button>Reset</button>
    </form>
</body>
</html>
